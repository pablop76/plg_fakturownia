; Joomla language file for Fakturownia integration
; Language: English (GB)
; Plugin: plg_hikashop_fakturownia

PLG_HIKASHOP_FAKTUROWNIA="HikaShop - Fakturownia Integration"
PLG_HIKASHOP_FAKTUROWNIA_DESC="Plugin integrating HikaShop with Fakturownia.pl invoicing system"

; Fieldsets
PLG_HIKASHOP_FAKTUROWNIA_FIELDSET_BASIC="Basic Settings"
PLG_HIKASHOP_FAKTUROWNIA_FIELDSET_CORRECTION="Corrections on cancellation/refund"
PLG_HIKASHOP_FAKTUROWNIA_FIELDSET_DEBUG="Debug Mode"

; API Token
PLG_HIKASHOP_FAKTUROWNIA_API_TOKEN_LABEL="Fakturownia API Token"
PLG_HIKASHOP_FAKTUROWNIA_API_TOKEN_DESC="Paste your Fakturownia API token here"

; Subdomain
PLG_HIKASHOP_FAKTUROWNIA_SUBDOMAIN_LABEL="Fakturownia Subdomain"
PLG_HIKASHOP_FAKTUROWNIA_SUBDOMAIN_DESC="Enter the subdomain name from Settings > Account Settings, e.g., mydomain (without .fakturownia.pl)"

; Seller
PLG_HIKASHOP_FAKTUROWNIA_SELLER_NAME_LABEL="Seller Company Name"
PLG_HIKASHOP_FAKTUROWNIA_SELLER_NAME_DESC="IMPORTANT: It must be identical to the name Settings → Company Details → Company Name in Invoicing"

PLG_HIKASHOP_FAKTUROWNIA_SELLER_TAX_NO_LABEL="Seller Tax Number (NIP)"
PLG_HIKASHOP_FAKTUROWNIA_SELLER_TAX_NO_DESC="Enter the seller's tax number matching the entry in Fakturownia"

; Trigger status
PLG_HIKASHOP_FAKTUROWNIA_TRIGGER_STATUS_LABEL="Trigger Status"
PLG_HIKASHOP_FAKTUROWNIA_TRIGGER_STATUS_DESC="HikaShop order status that triggers invoice creation (default 'confirmed' — paid order). You can list several statuses separated by commas, e.g. confirmed,shipped. Use the status namekey, not the label — you can find the keys in HikaShop → System → Order statuses (your own custom statuses work too). Invoices BEFORE payment: create your own status (e.g. 'Unpaid' for cash on delivery / on pickup) and enter its namekey here, e.g. confirmed,unpaid — the document is then issued for that status, but NOT for every freshly placed order (the 'created' status). Whether the document immediately gets a payment is decided by the separate 'Paid statuses' field."

; Payment days
PLG_HIKASHOP_FAKTUROWNIA_PAYMENT_DAYS_LABEL="Payment term (days)"
PLG_HIKASHOP_FAKTUROWNIA_PAYMENT_DAYS_DESC="Number of days for the 'Payment due' date on the document, counted from the issue date. Default 0 — with the 'confirmed' trigger status the order is already paid, so the document should not show a future due date. Set e.g. 7 or 14 if you issue invoices before payment (a trigger status outside 'Paid statuses')."

; Paid statuses
PLG_HIKASHOP_FAKTUROWNIA_PAID_STATUS_LABEL="Paid statuses"
PLG_HIKASHOP_FAKTUROWNIA_PAID_STATUS_DESC="Which order statuses mean a PAID order — this decides whether the document gets a payment. Default 'auto' = the status from HikaShop (System → Order statuses, the 'confirmed' column; normally 'confirmed'). You can also enter your own comma-separated list of status keys (namekey), e.g. confirmed,paid_in_store. A document issued at a paid status → immediately 'Paid'. Issued at an unpaid status (e.g. an invoice before payment for COD) → stays unpaid, and the payment is registered AUTOMATICALLY when the order moves to a paid status. Clear the field to never register payments automatically."

; Invoice mode
PLG_HIKASHOP_FAKTUROWNIA_INVOICE_MODE_LABEL="Fakturownia Document Type"
PLG_HIKASHOP_FAKTUROWNIA_INVOICE_MODE_DESC="Select the type of document generated by the plugin"

PLG_HIKASHOP_FAKTUROWNIA_OPTION_VAT="VAT Invoice"
PLG_HIKASHOP_FAKTUROWNIA_OPTION_RECEIPT="Receipt (requires paragony.pl module)"
PLG_HIKASHOP_FAKTUROWNIA_OPTION_AUTO="Receipt by default, Invoice when the customer provides a Tax ID or requests an invoice (requires paragony.pl module)"

; Invoice mode - Auto send email
PLG_HIKASHOP_FAKTUROWNIA_AUTO_SEND_EMAIL_LABEL="Automatically Send Invoice by Email"
PLG_HIKASHOP_FAKTUROWNIA_AUTO_SEND_EMAIL_DESC="If enabled, the invoice will be automatically sent to the customer's email address after creation."

; Custom note
PLG_HIKASHOP_FAKTUROWNIA_CUSTOM_NOTE_LABEL="Additional Options"
PLG_HIKASHOP_FAKTUROWNIA_CUSTOM_NOTE_DESC="Issue invoice if customer checks the field in billing address. Create a user field 'invoice_request' in the 'address' table in HikaShop."

; Coupon note
PLG_HIKASHOP_FAKTUROWNIA_COUPON_NOTE_LABEL="Add coupon code to document notes"
PLG_HIKASHOP_FAKTUROWNIA_COUPON_NOTE_DESC="If enabled, the used coupon code and its amount will be added to the invoice/receipt 'Notes' field (not as a separate position). The discount is always correctly applied to positions regardless of this setting — this is just an informational note for you about which coupon was used and by how much it reduced the order."

; Correction status
PLG_HIKASHOP_FAKTUROWNIA_CORRECTION_STATUS_LABEL="Cancellation/refund status(es)"
PLG_HIKASHOP_FAKTUROWNIA_CORRECTION_STATUS_DESC="Which order statuses mean cancellation/refund AFTER the document was issued. Default 'auto' = the plugin reads the list from HikaShop itself (System → Order statuses — every status with the 'cancelled' column checked, including your own custom statuses, e.g. 'return'). You can also enter status keys (namekey, not the label) manually, separated by commas, e.g. cancelled,refunded — this overrides the auto mode. When an order with an already-issued invoice/receipt changes to one of these statuses, you will always get a notification in the order history that the document needs a correction. Clear the field to disable this feature."

; Auto correction
PLG_HIKASHOP_FAKTUROWNIA_AUTO_CORRECTION_LABEL="Automatic correction"
PLG_HIKASHOP_FAKTUROWNIA_AUTO_CORRECTION_DESC="If enabled, the plugin will automatically issue a real accounting document in Fakturownia — a full correction invoice down to zero — when an order with an already-issued document is cancelled/refunded (see field above). Handles ONLY full order cancellation/refund (not partial). Disabled by default — even without this setting, you will always get a notification in the order history that a manual correction is needed, so nothing gets missed. Before enabling: try it on a separate Fakturownia account first (e.g. a free trial on another subdomain) — a wrong document created on your production account will need to be fixed manually."

; Reissue (button in the order view)
PLG_HIKASHOP_FAKTUROWNIA_REISSUE_BUTTON="Reissue in Fakturownia"
PLG_HIKASHOP_FAKTUROWNIA_REISSUE_CONFIRM="The issue markers will be cleared and the document will be issued AGAIN. If the previous document still exists in Fakturownia, a DUPLICATE will be created — delete it in Fakturownia first. Continue?"
PLG_HIKASHOP_FAKTUROWNIA_REISSUE_SUCCESS="Fakturownia: document reissued (ID %s)."
PLG_HIKASHOP_FAKTUROWNIA_REISSUE_FAILED="Fakturownia: document was NOT issued — check that the order has a trigger status and see the plugin log."
PLG_HIKASHOP_FAKTUROWNIA_REISSUE_NO_ORDER="Fakturownia: missing order ID."
PLG_HIKASHOP_FAKTUROWNIA_STATE_ISSUED="Document issued — Fakturownia ID: %s."
PLG_HIKASHOP_FAKTUROWNIA_STATE_CORRECTED="A correction was also issued (cancellation/refund)."
PLG_HIKASHOP_FAKTUROWNIA_STATE_NOTIFIED="Order cancelled/refunded — correction to be issued manually."
PLG_HIKASHOP_FAKTUROWNIA_STATE_UNPAID="Document unpaid — the payment will be registered automatically once the order moves to a paid status."
PLG_HIKASHOP_FAKTUROWNIA_STATE_ERROR="The last issue attempt failed — see the plugin log for details."
PLG_HIKASHOP_FAKTUROWNIA_STATE_NONE="No document issued for this order."

; Debug
PLG_HIKASHOP_FAKTUROWNIA_DEBUG_ORDER_LABEL="Show Full Order in Logs"
PLG_HIKASHOP_FAKTUROWNIA_DEBUG_ORDER_DESC="Enable logging only when debugging issues (e.g., Fakturownia API error)."

PLG_HIKASHOP_FAKTUROWNIA_DEBUG_LABEL="Debug Logs"
PLG_HIKASHOP_FAKTUROWNIA_DEBUG_DESC="Enable logging only when debugging issues (e.g., Fakturownia API error). Logs are written to administrator/logs/hikashop_fakturownia.log.php (open via FTP/file manager — the file is deliberately protected against reading through the browser)."


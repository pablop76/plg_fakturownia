PLG_HIKASHOP_FAKTUROWNIA_SYNC_PRODUCTS_LABEL="Product catalogue in Fakturownia"
PLG_HIKASHOP_FAKTUROWNIA_SYNC_PRODUCTS_PLUGIN="Managed by the plugin (with HikaShop codes)"
PLG_HIKASHOP_FAKTUROWNIA_SYNC_PRODUCTS_FAKTUROWNIA="Managed by Fakturownia (no codes)"
PLG_HIKASHOP_FAKTUROWNIA_SYNC_PRODUCTS_DESC="Who saves order products in the Fakturownia product catalogue. The invoice itself is not affected: position names, prices and VAT rates always come from the order.<br><br><strong>Managed by the plugin</strong>: before the invoice is issued, the plugin looks the product up in the catalogue by its HikaShop code and, if not found, by name. It adds a missing product and updates the code, name, net price and VAT rate of a found one. The invoice position gets a link to that product, so Fakturownia does not create a second entry. Every order product means 1 to 3 extra requests to Fakturownia while the order is being saved, so with a large cart the customer waits longer for the confirmation.<br><br><strong>Managed by Fakturownia</strong>: the plugin sends nothing to the catalogue. Fakturownia itself adds the positions of issued invoices to it and recognises them by name. The entries have no HikaShop codes, and a renamed product is added as a new one.<br><br>In both modes, shipping and payment fees (e.g. “Wysyłka: InPost Paczkomaty 24/7”) are added to the catalogue by Fakturownia itself."
PLG_HIKASHOP_FAKTUROWNIA_STATE_DUPLICATE="Fakturownia rejected the reissue: a document for this order number already exists. Check it in Fakturownia; to issue a new one, delete the previous one and click “Reissue in Fakturownia”."
PLG_HIKASHOP_FAKTUROWNIA_KSEF_STATUS="KSeF status: %s"
PLG_HIKASHOP_FAKTUROWNIA_KSEF_NUMBER="KSeF number: %s"
PLG_HIKASHOP_FAKTUROWNIA_KSEF_NONE="not sent"


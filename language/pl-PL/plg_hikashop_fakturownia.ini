; Joomla language file for Fakturownia integration
; Language: Polish
; Plugin: plg_hikashop_fakturownia

PLG_HIKASHOP_FAKTUROWNIA="Integracja HikaShop z Fakturownią"
PLG_HIKASHOP_FAKTUROWNIA_DESC="Wtyczka integrująca HikaShop z systemem Fakturownia.pl"

; Fieldsets
PLG_HIKASHOP_FAKTUROWNIA_FIELDSET_BASIC="Podstawowe ustawienia"
PLG_HIKASHOP_FAKTUROWNIA_FIELDSET_CORRECTION="Korekty przy anulowaniu/zwrocie"
PLG_HIKASHOP_FAKTUROWNIA_FIELDSET_DEBUG="Tryb debugowania"

; API Token
PLG_HIKASHOP_FAKTUROWNIA_API_TOKEN_LABEL="API Token Fakturownia"
PLG_HIKASHOP_FAKTUROWNIA_API_TOKEN_DESC="Wklej tutaj swój token API Fakturowni (Ustawienia → Ustawienia konta → Integracja → Kod autoryzacyjny API). Dane sprzedawcy wtyczka bierze z Fakturowni (Ustawienia → Dane firmy) — nie trzeba ich tu wpisywać."

; Subdomena
PLG_HIKASHOP_FAKTUROWNIA_SUBDOMAIN_LABEL="Subdomena Fakturownia"
PLG_HIKASHOP_FAKTUROWNIA_SUBDOMAIN_DESC="Wprowadź nazwę subdomeny ustawienia->ustawienia konta np. mojadomena (bez .fakturownia.pl)"

; Trigger status
PLG_HIKASHOP_FAKTUROWNIA_TRIGGER_STATUS_LABEL="Status wyzwalający wystawienie"
PLG_HIKASHOP_FAKTUROWNIA_TRIGGER_STATUS_DESC="Status zamówienia HikaShop, przy którym wystawiana jest faktura (domyślnie 'confirmed' — zamówienie opłacone). Można podać kilka statusów po przecinku, np. confirmed,shipped. Użyj klucza statusu (namekey), nie etykiety — klucze znajdziesz w HikaShop → System → Statusy zamówień (działają też Twoje własne statusy). Faktury PRZED zapłatą: utwórz własny status (np. „Nie opłacone" dla płatności za pobraniem / przy odbiorze) i wpisz tutaj jego namekey, np. confirmed,unpaid — dokument powstanie dla tego statusu, ale NIE dla każdego świeżo złożonego zamówienia (status 'created'). O tym, czy dokument dostanie od razu płatność, decyduje osobne pole 'Statusy opłacone'."

; Payment days
PLG_HIKASHOP_FAKTUROWNIA_PAYMENT_DAYS_LABEL="Termin płatności (dni)"
PLG_HIKASHOP_FAKTUROWNIA_PAYMENT_DAYS_DESC="Ile dni na 'Termin płatności' na dokumencie, licząc od daty wystawienia. Domyślnie 0 — przy statusie wyzwalającym 'confirmed' zamówienie jest już opłacone, więc dokument nie powinien pokazywać przyszłego terminu. Ustaw np. 7 lub 14, jeśli wystawiasz faktury przed zapłatą (status wyzwalający spoza 'Statusów opłaconych')."

; Paid statuses
PLG_HIKASHOP_FAKTUROWNIA_PAID_STATUS_LABEL="Statusy opłacone"
PLG_HIKASHOP_FAKTUROWNIA_PAID_STATUS_DESC="Które statusy zamówienia oznaczają OPŁACONE zamówienie — od tego zależy, czy dokument dostaje płatność. Domyślne 'auto' = status z HikaShop (System → Statusy zamówień, kolumna „confirmed"; standardowo 'confirmed'). Możesz podać własną listę kluczy (namekey) po przecinku, np. confirmed,zaplacono_gotowka. Dokument wystawiony przy statusie opłaconym → od razu 'Opłacona'. Wystawiony przy nieopłaconym (np. faktura przed zapłatą za pobraniem) → pozostaje nieopłacony, a płatność zarejestruje się AUTOMATYCZNIE, gdy zamówienie przejdzie na status opłacony. Wyczyść pole, aby nigdy nie rejestrować płatności automatycznie."

; Invoice mode
PLG_HIKASHOP_FAKTUROWNIA_INVOICE_MODE_LABEL="Typ dokumentu Fakturowni"
PLG_HIKASHOP_FAKTUROWNIA_INVOICE_MODE_DESC="Wybierz typ dokumentu generowanego przez wtyczkę"

PLG_HIKASHOP_FAKTUROWNIA_OPTION_VAT="Faktura VAT"
PLG_HIKASHOP_FAKTUROWNIA_OPTION_RECEIPT="Paragon (wymagany moduł paragony.pl)"
PLG_HIKASHOP_FAKTUROWNIA_OPTION_AUTO="Paragon domyślnie, a faktura gdy klient poda NIP lub sam zaznaczy fakturę (wymagany moduł paragony.pl)"

; Invoice mode - Auto send email
PLG_HIKASHOP_FAKTUROWNIA_AUTO_SEND_EMAIL_LABEL="Automatycznie wysyłaj fakturę e-mailem"
PLG_HIKASHOP_FAKTUROWNIA_AUTO_SEND_EMAIL_DESC="Jeśli włączone, po utworzeniu faktury Fakturownia wyśle ją na adres e-mail klienta. Przy aktywnym KSeF faktury dla firm Fakturownia wysyła dopiero po nadaniu numeru KSeF — gdy odmówi, w historii zamówienia pojawi się informacja, żeby wysłać dokument z Fakturowni."

; Custom note
PLG_HIKASHOP_FAKTUROWNIA_CUSTOM_NOTE_LABEL="Dodatkowe opcje"
PLG_HIKASHOP_FAKTUROWNIA_CUSTOM_NOTE_DESC="Wystaw fakturę, jeśli klient zaznaczy pole w adresie rozliczeniowym. Utwórz pole użytkownika 'invoice_request' w tabeli 'address' w HikaShop."

; Coupon note
PLG_HIKASHOP_FAKTUROWNIA_COUPON_NOTE_LABEL="Dopisz kupon w uwagach dokumentu"
PLG_HIKASHOP_FAKTUROWNIA_COUPON_NOTE_DESC="Jeśli włączone, kod i kwota użytego kuponu rabatowego zostaną dopisane w polu 'Uwagi' faktury/paragonu (nie jako osobna pozycja). Rabat jest zawsze naliczany poprawnie na pozycjach niezależnie od tego ustawienia — to tylko informacja dla Ciebie, który kupon został użyty i o ile obniżył zamówienie."

; Correction status
PLG_HIKASHOP_FAKTUROWNIA_CORRECTION_STATUS_LABEL="Status(y) anulowania/zwrotu"
PLG_HIKASHOP_FAKTUROWNIA_CORRECTION_STATUS_DESC="Które statusy zamówienia oznaczają anulowanie/zwrot PO wystawieniu dokumentu. Domyślne 'auto' = wtyczka sama pobiera listę z HikaShop (System → Statusy zamówień — wszystkie statusy z zaznaczoną kolumną „cancelled", również Twoje własne statusy, np. 'zwrot'). Możesz też wpisać ręcznie klucze statusów (namekey, nie etykietę) po przecinku, np. cancelled,refunded — to nadpisuje tryb auto. Gdy zamówienie z już wystawioną fakturą/paragonem zmieni status na jeden z tych statusów, zawsze dostaniesz powiadomienie w historii zamówienia, że dokument wymaga korekty. Wyczyść pole, żeby wyłączyć tę funkcję.

; Auto correction
PLG_HIKASHOP_FAKTUROWNIA_AUTO_CORRECTION_LABEL="Automatyczna korekta"
PLG_HIKASHOP_FAKTUROWNIA_AUTO_CORRECTION_DESC="Jeśli włączone, wtyczka automatycznie wystawi w Fakturowni prawdziwy dokument księgowy — fakturę korygującą do zera — gdy zamówienie z już wystawionym dokumentem zostanie anulowane/zwrócone (patrz pole wyżej). Obsługuje TYLKO pełne anulowanie/zwrot całego zamówienia (nie częściowe). Domyślnie WYŁĄCZONE — bez tego ustawienia i tak zawsze dostaniesz powiadomienie w historii zamówienia, że wymagana jest ręczna korekta, więc nic Ci nie umknie. Zanim włączysz: sprawdź działanie na osobnym koncie Fakturowni (np. darmowy okres próbny na innej subdomenie) — utworzenie błędnego dokumentu na koncie produkcyjnym trzeba będzie poprawiać ręcznie."

; Reissue (przycisk w widoku zamówienia)
PLG_HIKASHOP_FAKTUROWNIA_REISSUE_BUTTON="Wystaw ponownie w Fakturowni"
PLG_HIKASHOP_FAKTUROWNIA_REISSUE_CONFIRM="Znaczniki wystawienia zostaną wyczyszczone i wtyczka spróbuje wystawić dokument ponownie. Jeśli dokument dla tego zamówienia nadal istnieje w Fakturowni, Fakturownia odrzuci drugi (numer zamówienia musi być unikalny) — żeby wystawić nowy, najpierw usuń poprzedni w Fakturowni. Kontynuować?"
PLG_HIKASHOP_FAKTUROWNIA_REISSUE_SUCCESS="Fakturownia: dokument wystawiony ponownie (ID %s)."
PLG_HIKASHOP_FAKTUROWNIA_REISSUE_FAILED="Fakturownia: dokument NIE został wystawiony — sprawdź historię zamówienia, status wyzwalający oraz dziennik HikaShopa (System → Logi, źródło fakturownia)."
PLG_HIKASHOP_FAKTUROWNIA_REISSUE_NO_ORDER="Fakturownia: brak ID zamówienia."
PLG_HIKASHOP_FAKTUROWNIA_STATE_ISSUED="Dokument wystawiony — ID w Fakturowni: %s."
PLG_HIKASHOP_FAKTUROWNIA_STATE_CORRECTED="Wystawiono też korektę (anulowanie/zwrot)."
PLG_HIKASHOP_FAKTUROWNIA_STATE_NOTIFIED="Zamówienie anulowane/zwrócone — korekta do wystawienia ręcznie."
PLG_HIKASHOP_FAKTUROWNIA_STATE_UNPAID="Dokument nieopłacony — płatność zarejestruje się automatycznie po przejściu zamówienia na status opłacony."
PLG_HIKASHOP_FAKTUROWNIA_STATE_ERROR="Ostatnia próba wystawienia zakończyła się błędem — szczegóły w historii zamówienia i w dzienniku HikaShopa (System → Logi)."
PLG_HIKASHOP_FAKTUROWNIA_STATE_NONE="Brak wystawionego dokumentu dla tego zamówienia."

; Debug
PLG_HIKASHOP_FAKTUROWNIA_DEBUG_ORDER_LABEL="Pokaż całe zamówienie w logach"
PLG_HIKASHOP_FAKTUROWNIA_DEBUG_ORDER_DESC="Włącz logowanie tylko podczas debugowania problemów (np. błąd API Fakturowni)."

PLG_HIKASHOP_FAKTUROWNIA_DEBUG_LABEL="Debugowanie logów"
PLG_HIKASHOP_FAKTUROWNIA_DEBUG_DESC="Włącz tylko podczas szukania problemów (np. błąd API Fakturowni) — do dziennika trafią szczegóły żądań. Wpisy wtyczki znajdziesz w HikaShop → System → Logi (źródło fakturownia, filtr po zamówieniu); w HikaShopie starszym niż 6.8.1 — w pliku logu HikaShopa."

PLG_HIKASHOP_FAKTUROWNIA_SYNC_PRODUCTS_LABEL="Katalog produktów w Fakturowni"
PLG_HIKASHOP_FAKTUROWNIA_SYNC_PRODUCTS_PLUGIN="Prowadzi wtyczka (z kodami z HikaShopa)"
PLG_HIKASHOP_FAKTUROWNIA_SYNC_PRODUCTS_FAKTUROWNIA="Prowadzi Fakturownia (bez kodów)"
PLG_HIKASHOP_FAKTUROWNIA_SYNC_PRODUCTS_DESC="Kto zapisuje produkty z zamówień w katalogu produktów Fakturowni. Na samą fakturę nie ma to wpływu: nazwy, ceny i stawki VAT pozycji zawsze pochodzą z zamówienia.<br><br><strong>Prowadzi wtyczka</strong>: przed wystawieniem faktury wtyczka szuka produktu w katalogu po kodzie z HikaShopa, a gdy go nie znajdzie, po nazwie. Brakujący produkt dodaje, a znalezionemu uaktualnia kod, nazwę, cenę netto i stawkę VAT. Pozycja faktury dostaje odnośnik do tego produktu, więc Fakturownia nie tworzy drugiego wpisu. Każdy produkt z zamówienia to od 1 do 3 dodatkowych żądań do Fakturowni w trakcie zapisu zamówienia, więc przy dużym koszyku klient dłużej czeka na potwierdzenie.<br><br><strong>Prowadzi Fakturownia</strong>: wtyczka nie wysyła nic do katalogu. Fakturownia sama dopisuje do niego pozycje wystawionych faktur i rozpoznaje je po nazwie. Wpisy nie mają kodów z HikaShopa, a produkt po zmianie nazwy trafia do katalogu jako nowy.<br><br>W obu trybach wysyłkę i koszt płatności (np. „Wysyłka: InPost Paczkomaty 24/7”) dopisuje do katalogu sama Fakturownia."
PLG_HIKASHOP_FAKTUROWNIA_STATE_DUPLICATE="Fakturownia odrzuciła ponowne wystawienie: dokument dla tego numeru zamówienia już istnieje. Sprawdź go w Fakturowni; żeby wystawić nowy, usuń poprzedni i kliknij „Wystaw ponownie”."
PLG_HIKASHOP_FAKTUROWNIA_KSEF_STATUS="Status KSeF: %s"
PLG_HIKASHOP_FAKTUROWNIA_KSEF_NUMBER="numer KSeF: %s"
PLG_HIKASHOP_FAKTUROWNIA_KSEF_NONE="nie wysłano"

